name: Release
on:
  push:
    tags:
      - v[0-9]+.[0-9]+.[0-9]+
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    name: Validate tag
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Require the tag to be on main
        run: |
          if ! git merge-base --is-ancestor "${GITHUB_REF_NAME}^{commit}" origin/main; then
            printf 'tag must point to a commit on main: %s\n' "$GITHUB_REF_NAME" >&2
            exit 1
          fi
      - name: Test with race detector
        run: make test
  build:
    name: Build release binaries
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Cross-build
        env:
          VERSION: ${{ github.ref_name }}
        run: make release-build
      - name: Check version string
        run: test "$(dist/codex-router-linux-amd64 version)" = "$GITHUB_REF_NAME"
      - name: Upload binaries
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-dist
          path: dist/*
          if-no-files-found: error
          retention-days: 1
  release:
    name: Create GitHub release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Download binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-dist
          path: dist
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # An annotated tag's message is the release notes; otherwise GitHub
          # generates them from the merged pull requests and commits.
          note_args=(--generate-notes)
          if [[ "$(git cat-file -t "$GITHUB_REF_NAME")" == "tag" ]]; then
            tag_notes="$(git for-each-ref --format='%(contents:subject)%0a%(contents:body)' "refs/tags/$GITHUB_REF_NAME")"
            if [[ -n "${tag_notes//[[:space:]]/}" ]]; then
              note_args=(--notes-from-tag)
            fi
          fi
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            "${note_args[@]}"
