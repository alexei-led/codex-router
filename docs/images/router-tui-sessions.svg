<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 789 484" width="789" height="484" role="img" aria-labelledby="title desc">
  <title id="title">codex-router panel, Sessions view</title>
  <desc id="desc">codex-router tui in a 97 column pane. The header counts 5 sessions in 2 homes, says Jev is ready, and lists the views Sessions, Policy and Usage. The list groups the sessions by Codex home: the default home has three codex-router runs, the work home has a brain that has run for 2 hours and a router whose Codex has not had a first prompt yet. Each row has the session's state, model and effort, a sparkline of the last turns by tier and the last switch. Below, the selected session: the high tier chip, the debug activity and the route gpt-6.1-sol high, why the router moved up, the classifier's evidence, the pin buttons, the session summary with its strip, context and cache, and one thing worth a look.</desc>
