version: "2"
run:
  timeout: 5m
linters:
  default: standard
  enable:
    - errorlint
    - gocritic
    - misspell
    - nolintlint
    - perfsprint
    - unconvert
    - usestdlibvars
    - whitespace
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/alexei-led/codex-router
